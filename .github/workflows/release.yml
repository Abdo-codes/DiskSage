name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < VERSION)"
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test
        run: swift test
      - name: Build app bundle
        run: ./Scripts/build-app.sh release
      - name: Package and checksum
        run: |
          ditto -c -k --keepParent .build/release/DiskSage.app "DiskSage-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "DiskSage-${GITHUB_REF_NAME}.zip" > "DiskSage-${GITHUB_REF_NAME}.zip.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            DiskSage-*.zip
            DiskSage-*.zip.sha256
