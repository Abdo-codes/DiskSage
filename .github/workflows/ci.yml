name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test
        run: swift test
      - name: Build app bundle
        run: ./Scripts/build-app.sh release
